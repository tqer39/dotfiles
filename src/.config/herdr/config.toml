onboarding = false
# Herdr configuration
# https://herdr.dev/docs/configuration

[terminal]
default_shell = "zsh"
new_cwd = "follow"

[theme]
name = "tokyo-night"
auto_switch = false
light_name = "tokyo-night-day"
dark_name = "tokyo-night"

[keys]
prefix = "ctrl+b"

# Send the input Undo shortcut instead of suspending the foreground process.
[[keys.command]]
key = "ctrl+z"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" pane send-keys "${HERDR_ACTIVE_PANE_ID:?}" ctrl+_'
description = "Undo input (Control+_)"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"
description = "run lazygit"

[ui]
sidebar_width = 32
mouse_capture = true
confirm_close = true
pane_borders = true
pane_gaps = true

agent_panel_sort = "spaces"
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
