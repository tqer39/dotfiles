os = ["macos"]

[tools."github:jacobbednarz/cf-vault".platforms]
macos-arm64 = { asset_pattern = "cf-vault_0.0.26_darwin_arm64.tar.gz", checksum = "sha256:9eed22f23188d66c41af774ac4ed0ece670f48af02f4f3cd2183fd096e77e41f" }
