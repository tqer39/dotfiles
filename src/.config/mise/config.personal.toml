[tools]
# Language Runtimes
node = "24"

# AI CLI Tools
"npm:@google/gemini-cli" = "latest"
"npm:@openai/codex" = "latest"
"npm:@github/copilot" = "latest"
"npm:ctx7" = "latest"

# Official macOS binaries; keep the version and publisher checksums together.
[tools."github:jacobbednarz/cf-vault"]
