---
name: lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true

      - name: Identify validator runtime
        id: validator-runtime
        run: |
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "npm=$(npm --version)" >> "$GITHUB_OUTPUT"
          # npx の取得データと展開済みパッケージを専用ディレクトリに保存する。
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/renovate-npm-cache" >> "$GITHUB_ENV"

      - name: Cache Renovate validator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/renovate-npm-cache
          # 展開済みの依存関係は OS・CPU・実行環境・検証定義が一致するときだけ再利用する。
          key: renovate-validator-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.validator-runtime.outputs.node }}-${{ steps.validator-runtime.outputs.npm }}-${{ hashFiles('lefthook.yml') }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify mise tasks
        run: |
          mise tasks validate
          python3 tests/test-mise-tasks.py

      - name: Run lint tasks
        run: mise run lint

      - name: Verify agent worktree wrappers
        run: python3 tests/test-agent-worktree.py

      - name: Verify keyboard shortcuts
        run: python3 tests/test-herdr-config.py
